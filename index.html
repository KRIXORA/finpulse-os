<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinPulse">
<title>FinPulse-OS | Personal Finance Dashboard</title>
<meta name="description" content="Track your finances, budgets, goals, and spending insights in real time.">
<meta name="theme-color" content="#05070d">
<meta property="og:title" content="FinPulse-OS | Personal Finance Dashboard">
<meta property="og:description" content="Track your finances, budgets, goals, and spending insights in real time.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2360A5FA'/%3E%3Cstop offset='1' stop-color='%232563EB'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-family='Arial,sans-serif' font-size='56' font-weight='700' fill='%2305070d' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
</head>
<body>

<div class="app-loader" id="appLoader"><div class="app-loader__spinner"></div></div>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__brand-mark">F</div>
      <span class="sidebar__brand-name">FinPulse</span>
    </div>

    <nav class="sidebar__nav">
      <a href="#dashboard" class="nav-link is-active">
        <span class="nav-link__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span> Dashboard
      </a>
      <a href="#transactions" class="nav-link">
        <span class="nav-link__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg></span> Transactions
      </a>
      <a href="#budget" class="nav-link">
        <span class="nav-link__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10l8.5 5A10 10 0 1 1 12 2z"/></svg></span> Budget Planner
      </a>
      <a href="#goals" class="nav-link">
        <span class="nav-link__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span> Goals
      </a>
      <a href="#insights" class="nav-link">
        <span class="nav-link__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.8L12 16.4l-1.8-4.9L5 9.7l5.2-1.8L12 3z"/></svg></span> AI Insights
      </a>
      <a href="#analytics" class="nav-link">
        <span class="nav-link__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="18" y1="20" x2="18" y2="15"/></svg></span> Analytics
      </a>
      <a href="#settings" class="nav-link">
        <span class="nav-link__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V19a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.5V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V10a1.7 1.7 0 0 0 1.5 1H20a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg></span> Settings
      </a>
    </nav>

    <div class="sidebar__footer">
      Built by <strong style="color:var(--color-accent-400)">KRIXORA</strong>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">

    <!-- Topbar -->
    <header class="topbar">
      <button class="topbar__menu-btn btn-icon btn-ghost" id="menuToggle" aria-label="Toggle menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>

      <div class="topbar__search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Search transactions" aria-label="Search transactions">
      </div>

      <div class="topbar__actions">
        <div class="notif-wrap" id="notifWrap" style="position:relative;">
          <button class="topbar__icon-btn" id="notifBtn" aria-label="Notifications" aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="topbar__badge" id="notifBadge" style="display:none;"></span>
          </button>
          <div class="notif-panel" id="notifPanel" style="display:none;"></div>
        </div>
        <button class="btn btn-primary btn-sm" id="addTransactionBtn">+ Add Transaction</button>
      </div>
    </header>

    <!-- Router mounts the active view's markup here — see js/router.js and js/views/ -->
    <div class="page" id="pageRoot"></div>
  </div>
</div>

<!-- ============ ADD TRANSACTION MODAL ============ -->
<div class="modal-overlay" id="transactionModal" style="display:none;">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="transactionModalTitle">
    <div class="modal__header">
      <span class="modal__title" id="transactionModalTitle">Add Transaction</span>
      <button class="btn-icon btn-ghost" id="closeModalBtn" aria-label="Close dialog"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg></button>
    </div>
    <div class="tab-group">
      <span class="tab is-active">Expense</span>
      <span class="tab">Income</span>
    </div>
    <div class="field">
      <label class="field__label" for="txTitleInput">Title</label>
      <input class="input" type="text" id="txTitleInput" placeholder="e.g. Grocery shopping" maxlength="80" autocomplete="off">
    </div>
    <div class="field">
      <label class="field__label" for="txAmountInput">Amount (&#8377;)</label>
      <input class="input" type="number" id="txAmountInput" placeholder="0.00" min="0.01" max="10000000" step="0.01" inputmode="decimal">
    </div>
    <div class="field">
      <label class="field__label" for="txCategorySelect">Category</label>
      <select class="select" id="txCategorySelect">
        <option>Food & Groceries</option>
        <option>Transport</option>
        <option>Bills & Utilities</option>
        <option>Shopping</option>
        <option>Entertainment</option>
        <option>Health</option>
        <option>Income</option>
        <option>Other</option>
        <option value="__custom__">+ Add custom category&hellip;</option>
      </select>
    </div>
    <div class="field" id="txCustomCategoryField" style="display:none;">
      <label class="field__label" for="txCustomCategoryInput">New Category Name</label>
      <input class="input" type="text" id="txCustomCategoryInput" placeholder="e.g. Pet Care" maxlength="40" autocomplete="off">
    </div>
    <div class="field">
      <label class="field__label" for="txDateInput">Date</label>
      <input class="input" type="date" id="txDateInput">
    </div>
    <div class="modal__actions">
      <button class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
      <button class="btn btn-primary" id="saveRecordBtn">Save Record</button>
    </div>
  </div>
</div>

<!-- ============ SET BUDGET MODAL ============ -->
<div class="modal-overlay" id="budgetModal" style="display:none;">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="budgetModalTitle">
    <div class="modal__header">
      <span class="modal__title" id="budgetModalTitle">Set Budget Limit</span>
      <button class="btn-icon btn-ghost" id="closeBudgetModalBtn" aria-label="Close dialog"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg></button>
    </div>
    <div class="field">
      <label class="field__label" for="budgetCategoryInput">Category</label>
      <select class="select" id="budgetCategoryInput">
        <option>Food & Groceries</option>
        <option>Transport</option>
        <option>Bills & Utilities</option>
        <option>Shopping</option>
        <option>Entertainment</option>
        <option>Health</option>
        <option>Other</option>
        <option value="__custom__">+ Add custom category&hellip;</option>
      </select>
    </div>
    <div class="field" id="budgetCustomCategoryField" style="display:none;">
      <label class="field__label" for="budgetCustomCategoryInput">New Category Name</label>
      <input class="input" type="text" id="budgetCustomCategoryInput" placeholder="e.g. Pet Care" maxlength="40" autocomplete="off">
    </div>
    <div class="field">
      <label class="field__label" for="budgetLimitInput">Monthly Limit (&#8377;)</label>
      <input class="input" type="number" id="budgetLimitInput" placeholder="0.00" min="1" max="10000000" step="0.01" inputmode="decimal">
    </div>
    <div class="modal__actions">
      <button class="btn btn-secondary" id="cancelBudgetModalBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBudgetBtn">Save Limit</button>
    </div>
  </div>
</div>

<!-- ============ GOAL MODAL ============ -->
<div class="modal-overlay" id="goalModal" style="display:none;">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="goalModalTitle">
    <div class="modal__header">
      <span class="modal__title" id="goalModalTitle">New Savings Goal</span>
      <button class="btn-icon btn-ghost" id="closeGoalModalBtn" aria-label="Close dialog"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg></button>
    </div>
    <div class="field">
      <label class="field__label" for="goalNameInput">Goal Name</label>
      <input class="input" type="text" id="goalNameInput" placeholder="e.g. Emergency Fund" maxlength="80" autocomplete="off">
    </div>
    <div class="field">
      <label class="field__label" for="goalTargetInput">Target Amount (&#8377;)</label>
      <input class="input" type="number" id="goalTargetInput" placeholder="0.00" min="1" max="100000000" step="0.01" inputmode="decimal">
    </div>
    <div class="field">
      <label class="field__label" for="goalSavedInput">Already Saved (&#8377;)</label>
      <input class="input" type="number" id="goalSavedInput" placeholder="0.00" min="0" max="100000000" step="0.01" inputmode="decimal" value="0">
    </div>
    <div class="field">
      <label class="field__label" for="goalDeadlineInput">Target Date (optional)</label>
      <input class="input" type="date" id="goalDeadlineInput">
    </div>
    <div class="modal__actions">
      <button class="btn btn-secondary" id="cancelGoalModalBtn">Cancel</button>
      <button class="btn btn-primary" id="saveGoalBtn">Save Goal</button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
